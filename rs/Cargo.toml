# The Rust port of @tabnas/semver. ts/ is canonical; go/ and this crate
# track it. `version` MUST equal ts/package.json "version", `VERSION` in
# ts/src/semver.ts and `const VERSION` in go/semver.go:
# tests/version_test.rs fails the build when they drift.

[package]
name = "tabnas-semver"
version = "0.0.10"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Semantic Versioning 2.0.0 (semver.org) parsing for the tabnas engine, compiled from an ABNF grammar"
repository = "https://github.com/tabnas/semver"

[lib]
name = "tabnas_semver"
path = "src/lib.rs"

[dependencies]
# The engine is consumed as a SIBLING CHECKOUT, the standard tabnas
# development model: clone https://github.com/tabnas/parser next to this
# repo. It is the crate's only tabnas dependency. The ABNF compiler is
# not one, in any table: the grammar is compiled at build time, by the
# TypeScript toolchain (`npm run gen-grammar`), into
# semver-grammar.json, which src/lib.rs embeds.
tabnas = { package = "tabnas-parser", path = "../../parser/rs" }
indexmap = "2"
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
# The shared fixture loader, runner and divergence register: one loader in
# three languages, so the rows mean the same thing in every runtime.
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }
# The oracle suite grades the plugin against the regular expression
# semver.org publishes. Tests only: the plugin itself installs a grammar
# and matches no patterns of its own.
regex = "1.10"
# The introspection plugin, for the composition test that mirrors
# `ts/test/debug-model.test.ts`: the semver grammar layered with the
# debug plugin, and the structured model of the installed rule set. A
# third sibling checkout, tests only.
tabnas-debug = { path = "../../debug/rs" }
