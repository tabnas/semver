# The Rust port of @tabnas/semver. ts/ is canonical; go/ and this crate
# track it. `version` MUST equal ts/package.json "version", `VERSION` in
# ts/src/semver.ts and `const VERSION` in go/semver.go:
# tests/version_test.rs fails the build when they drift.

[package]
name = "tabnas-semver"
version = "0.0.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Semantic Versioning 2.0.0 (semver.org) parsing for the tabnas engine, compiled from an ABNF grammar"
repository = "https://github.com/tabnas/semver"

[lib]
name = "tabnas_semver"
path = "src/lib.rs"

[dependencies]
# The engine and the ABNF compiler are consumed as SIBLING CHECKOUTS, the
# standard tabnas development model: clone https://github.com/tabnas/parser
# and https://github.com/tabnas/abnf next to this repo. Neither crate is
# published, so there is no registry version to fall back on.
#
# Clone https://github.com/tabnas/bnf as well. It gets no entry here,
# because it is tabnas-abnf that depends on it, but cargo reads the whole
# manifest graph before it compiles anything, so without that checkout
# nothing here resolves.
tabnas = { path = "../../parser/rs" }
tabnas-abnf = { path = "../../abnf/rs" }
indexmap = "2"
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
# The shared fixture loader, runner and divergence register: one loader in
# three languages, so the rows mean the same thing in every runtime.
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }
# The oracle suite grades the plugin against the regular expression
# semver.org publishes. Tests only: the plugin itself compiles a grammar
# and matches no patterns of its own.
regex = "1.10"
