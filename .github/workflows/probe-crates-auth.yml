# Temporary probe (deleted after one run): does the org actions policy
# admit rust-lang/crates-io-auth-action? Job "gated" mirrors the staged
# release.yml -> crates-release.yml shape with its job skipped; job
# "direct" runs the action, which is expected to fail at the token
# exchange (no trusted publisher is configured), not at "Set up job".
name: probe-crates-auth
on:
  push:
    branches: [claude/probe-crates-auth-action]
permissions:
  contents: read
jobs:
  gated:
    uses: ./.github/workflows/probe-crates-auth-called.yml
    permissions:
      contents: read
      id-token: write
  direct:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
        continue-on-error: true
